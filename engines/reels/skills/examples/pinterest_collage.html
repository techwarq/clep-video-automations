<!doctype html>
<!-- Pinterest edit · commentary collage (YouTube-essay / recap look). White canvas, a giant
     yellow headline with a thick black outline, footage in rounded cards that pop in as a
     collage (1–3 per beat, slight tilts), a meme "reaction" sticker that slides in on punchlines,
     bold captions. Plan: narrated beats; media keys per beat (b1, b1b, ...) + reaction images.
     CONFIG is per reel; the rest is craft. -->
<html>
<head>
<meta charset="utf-8">
<script src="data.js"></script>
<script src="runtime.js"></script>
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #fbfaf7; }
  #dots { position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(0,0,0,.08) 2px, transparent 2px); background-size: 44px 44px; }
  #title { position: absolute; left: 40px; right: 40px; top: 210px; text-align: center; white-space: nowrap;
    font: 900 118px/1 'Arial Black', 'Avenir Next', sans-serif; letter-spacing: -2px; color: #ffe94a;
    -webkit-text-stroke: 9px #0b0b0b; paint-order: stroke fill; text-shadow: 0 10px 0 rgba(0,0,0,.12); }
  .card { position: absolute; border-radius: 40px; overflow: hidden; background: #ddd;
    box-shadow: 0 24px 50px rgba(0,0,0,.22), 0 0 0 8px #fff; }
  .card img { width: 100%; height: 100%; object-fit: cover; }
  #react { position: absolute; width: 430px; height: 520px; border-radius: 36px; overflow: hidden;
    box-shadow: 0 0 0 10px #fff, 0 26px 50px rgba(0,0,0,.3); }
  #react img { width: 100%; height: 100%; object-fit: cover; }
  #cap { position: absolute; left: 60px; right: 60px; top: 1600px; text-align: center;
    font: 900 74px/1.05 'Avenir Next', sans-serif; text-transform: uppercase; color: #0b0b0b; letter-spacing: -1px; }
  #cap span { padding: 0 10px; border-radius: 12px; }
</style>
</head>
<body>
<div id="dots"></div>
<div id="title"></div>
<div class="card" id="c0"><img id="i0"></div>
<div class="card" id="c1"><img id="i1"></div>
<div class="card" id="c2"><img id="i2"></div>
<div id="react"><img id="ri"></div>
<div id="cap"></div>
<script>
  // ───────── CONFIG (per reel) ─────────
  // title: yellow headline for the beat (keep it to ~14 characters so it fits on one line).
  // cards: footage keys; 1 = one big card, 2 = stacked, 3 = the two-up + one-below collage.
  // react: {key, w} — reaction sticker slides in on word w of the beat.
  const BEATS = {
    b1: { title: 'THE ROOKIE', cards: ['b1'] },
    b2: { title: 'DAY ONE', cards: ['b2', 'b2b'] },
    b3: { title: 'THE PLOT TWIST', cards: ['b3', 'b3b', 'b4'], react: { key: 'react', w: 3 } },
    b4: { title: 'NOW?', cards: ['b4'] },
  };
  const ACCENT = '#ffe94a';
  R.music('warm_drive', { gain: 0.16 });

  // ───────── craft ─────────
  // card boxes per layout: [x, y, w, h, tilt]
  const LAYOUTS = {
    1: [[90, 420, 900, 1080, -1.5]],
    2: [[90, 400, 900, 560, -1.5], [150, 1000, 840, 540, 1.8]],
    3: [[50, 420, 470, 560, -2], [560, 420, 470, 560, 2], [270, 1020, 540, 540, -1]],
  };
  const wordT = (b, w) => R.words[Math.min(b.w0 + w, R.words.length - 1)].start - 0.05;
  for (const b of R.beats) {
    const c = BEATS[b.id] || {};
    R.sfx('swish', b.t0 + 0.02, 0.35);
    (c.cards || []).forEach((_, i) => i && R.sfx('pop', b.t0 + 0.3 + i * 0.35, 0.4));
    if (c.react) R.sfx('whoosh_fast', wordT(b, c.react.w) - 0.1, 0.5);
  }
  const CAPS = R.chunks({ maxWords: 3, maxChars: 16 });

  R.scene(t => {
    const b = R.beatAt(t), c = BEATS[b.id] || {}, local = t - b.t0;

    // headline: slams in at every beat start with a spring + tiny shake
    const ts = R.S(local, 0, 20, 0.45), [sx, sy] = R.shake(t, b.t0, 8, 0.1);
    R.$('title').textContent = c.title || '';
    const fit = Math.min(118, 1350 / Math.max(1, (c.title || '').length));   // one line, never off-frame
    R.css('title', { fontSize: fit + 'px', transform: `translate(${sx}px,${sy}px) scale(${0.7 + 0.3 * ts}) rotate(${(1 - ts) * -3}deg)` });

    // collage cards: each pops in 0.35 s after the previous, then everything breathes
    const keys = c.cards || [], boxes = LAYOUTS[Math.min(3, Math.max(1, keys.length))];
    for (let i = 0; i < 3; i++) {
      const on = i < keys.length;
      R.vis('c' + i, on);
      if (!on) continue;
      const [x, y, w, h, tilt] = boxes[i];
      const s = R.S(local, 0.05 + i * 0.35, 17, 0.55), drift = 1 + 0.02 * R.clamp(local / 4);
      R.show('i' + i, keys[i], local + 0.3, { mode: 'loop' });
      R.css('c' + i, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px',
        transform: `scale(${s * drift}) rotate(${tilt * s}deg)`, opacity: R.clamp(s * 3) });
    }

    // reaction sticker: slides in from the right edge on its word, holds tilted, leaves with the beat
    const r = c.react && t >= wordT(b, c.react.w);
    R.vis('react', !!r);
    if (r) {
      const s = R.S(t, wordT(b, c.react.w), 15, 0.6);
      R.show('ri', c.react.key, t - wordT(b, c.react.w), { mode: 'loop' });
      R.css('react', { left: `${R.lerp(1100, 610, s)}px`, top: '980px', transform: `rotate(${R.lerp(14, 6, s)}deg)` });
    }

    // captions: spoken word on a yellow marker
    const ch = R.chunkAt(CAPS, t), spoken = R.wordAt(t);
    R.vis('cap', !!ch);
    if (ch) {
      R.$('cap').innerHTML = ch.words.map((w, j) =>
        `<span style="${ch.i0 + j === spoken ? `background:${ACCENT}` : ''}">${R.esc(R.clean(w.w))}</span>`).join(' ');
      R.css('cap', { transform: `scale(${0.88 + 0.12 * R.S(t, ch.start, 26, 0.6)})` });
    }
  });
</script>
</body>
</html>
