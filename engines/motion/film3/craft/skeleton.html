<!doctype html>
<!-- STRUCTURE ONLY. Grey placeholders mark where the product's own UI, story, world and words go.
     Copy the machinery (camera, carrier table, cross-reveal, crowd stack, taps, words, EVENTS), never the look.
     22 s, 100 bpm (bar 2.4 s), drop on bar 4 (7.2 s). Passes `check` with no CRAFT problems. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#eef0f3;font-family:Inter,sans-serif;color:#15171a}
/* WORLD: a designed space that always moves a little */
#world{position:absolute;inset:-60px;background-image:radial-gradient(circle,rgba(0,0,0,.13) 2px,transparent 2.6px);background-size:48px 48px}
/* STAGE: what the camera moves in act 1; transform-origin 0 0 so cam() math is exact */
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.item{position:absolute;left:260px;width:900px;height:120px;border-radius:28px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.07);padding:30px 34px}
.bar{height:20px;border-radius:10px;background:#d9dde3}
/* CARRIER WORLD: carrier + taps share one wrapper with a slow push, so holds never freeze */
#cw{position:absolute;inset:0;transform-origin:960px 540px}
/* CARRIER: ONE element that morphs through every state (size from the shape table) */
#carrier{position:absolute;overflow:hidden;background:#fff;box-shadow:0 40px 90px rgba(0,0,0,.14)}
.L{position:absolute;inset:0;padding:52px 60px}
.big{font-size:76px;font-weight:700;letter-spacing:-2px}
.act{position:absolute;left:0;right:0;bottom:0;height:120px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:700;letter-spacing:.06em;background:#e9ecf0}
/* WORDS: their own clear space (above the subject), never on it */
.lab{position:absolute;left:0;width:1920px;text-align:center;top:64px;font-size:84px;font-weight:700;letter-spacing:-2.5px}
.side{position:absolute;left:1260px;top:400px;font-size:130px;font-weight:800;letter-spacing:-5px;line-height:1.02;white-space:nowrap;transform-origin:left center}
#cwrap{position:absolute;left:0;width:1920px;top:250px;display:flex;flex-direction:column;align-items:center}
#counter{font-size:440px;font-weight:800;letter-spacing:-12px;line-height:1;font-variant-numeric:tabular-nums}
#clab{font-size:76px;font-weight:600;margin-top:70px}
#tap{position:absolute;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:32px;background:rgba(0,0,0,.22);border:2px solid #fff}
#ripple{position:absolute;border-radius:50%;border:3px solid rgba(0,0,0,.25)}
#end{position:absolute;left:0;width:1920px;top:440px;text-align:center;font-size:150px;font-weight:800;letter-spacing:-5px}
</style>
</head>
<body>
<div id="world"></div>
<div id="stage"><div id="crowd"></div></div>
<div id="cw">
  <div id="carrier">
    <div class="L" id="L1"><div class="bar" style="width:40%"></div><div class="big" style="margin-top:40px">‹state 1›</div><div class="act" id="act1">ACTION</div></div>
    <div class="L" id="L2"><div class="bar" style="width:55%"></div><div class="big" style="margin-top:40px">‹state 2›</div><div class="bar" id="fill" style="width:0;margin-top:48px;background:#15171a"></div><div class="act">ACTION</div></div>
    <div class="L" id="L3" style="display:flex;align-items:center"><div class="big" style="font-size:56px">‹state 3: one of many›</div></div>
  </div>
  <div id="ripple"></div><div id="tap"></div>
</div>
<div class="side" id="w0">‹the<br>problem›</div>
<div class="side" id="w1">‹gets<br>worse›</div>
<div class="lab" id="w2" style="top:700px;font-size:120px;letter-spacing:-4px">‹what if…›</div>
<div class="lab" id="w3">‹what the first state does›</div>
<div class="lab" id="w4">‹what the second state does›</div>
<div id="cwrap"><div id="counter">0</div><div id="clab">‹what the number proves›</div></div>
<div id="end">‹logo›</div>

<script src="core.js"></script>
<script>
const {E, clamp, lerp, P, kf, px, fontsReady} = K;
const $ = s => document.getElementById(s);
const css = (el, o) => { el = typeof el === 'string' ? $(el) : el; for (const k in o) el.style[k] = o[k]; return el; };
const show = (id, on) => { $(id).style.display = on ? '' : 'none'; return on; };

// MUSIC GRID (from music_grid): every act starts on a bar; the payoff lands ON the drop
const BAR = 2.4, B = n => (n - 1) * BAR, DROP = B(4);          // 7.2 s

// CROWD: arrivals accelerate (the problem gets worse); each one pushes the stack down
const ARR = [0.3, 0.9, 1.5, 2.0, 2.45, 2.85, 3.2, 3.5, 3.75, 3.95, 4.12, 4.27, 4.4];
const ONE = 3, SWIPE = B(3);                                    // the survivor; everything else is swept away

// CARRIER SHAPE TABLE [t, [w, h, cy, radius]]. At the drop it matches the survivor's on-screen size
// (item 900×120 × camera 1.6), then morphs. States read BIG: 60–80% of the frame width.
const ITEM = [1440, 240, 540, 45], S1 = [1280, 640, 560, 44], S2 = [1400, 700, 570, 44], S3 = [1400, 220, 540, 38];
const SHAPE = [[0, ITEM], [DROP, ITEM], [DROP + 0.55, S1, t => E.outBack(t, 1.1)], [B(6) - 0.3, S1], [B(6) + 0.2, S2, E.inOutCubic],
               [B(7) + 1.6, S2], [B(7) + 2.1, S3, E.inOutCubic], [99, S3]];

// CAMERA on the stage: focus F placed at frame point Pt, scale in LOG space, then a scale-through on the drop
function cam(t) {
  const p = P(t, SWIPE + 0.1, DROP - 0.2, E.outCubic)          /* fast first: the one fills the frame at once */, q = P(t, DROP, DROP + 0.5, E.inCubic);
  const s = Math.exp(lerp(0, Math.log(1.6), p) + Math.log(1.4) * q) * (1 + 0.012 * Math.sin(t * 0.8));
  const F = [710, 540], Pt = [lerp(710, 960, p), 540];                // the survivor's centre moves to frame centre
  return { s, tx: Pt[0] - F[0] * s, ty: Pt[1] - F[1] * s };
}

// CROSS-REVEAL inside the carrier: opacity + scale 0.95→1 + blur 8→0 over ~0.24 s (never a swap)
function layer(id, a0, a1, d = 0.24) {
  const a = P(T, a0, a0 + d, E.outCubic) * (1 - P(T, a1, a1 + d * 0.8, E.inCubic));
  if (show(id, a > 0.001)) css(id, { opacity: a.toFixed(3), transform: `scale(${(0.95 + 0.05 * a).toFixed(4)})`, filter: `blur(${((1 - a) * 8).toFixed(1)}px)` });
  return a;
}
// WORDS: 'cut' = quick scale-in (energy), 'rise' = soft lift (calm). One at a time.
function word(id, a0, a1, mode = 'rise') {
  const i = P(T, a0, a0 + (mode === 'cut' ? 0.12 : 0.34), E.outExpo), o = P(T, a1, a1 + 0.2, E.inCubic), v = i * (1 - o);
  if (show(id, v > 0.001)) css(id, { opacity: v, filter: `blur(${((1 - i) * 10 + o * 8).toFixed(1)}px)`,
    transform: mode === 'cut' ? `scale(${(1.06 - 0.06 * i).toFixed(4)})` : `translateY(${px((1 - i) * 30 - o * 20)})` });
}
const TAPS = [B(5) + 0.6, B(6) + 1.2];                          // a real action in every state, on a beat
let T = 0;

// EVENTS: every visible action → a sound (the free sound pass fills whatever mix.json lacks)
window.EVENTS = [...ARR.map(a => [a, 'pop']), [1.2, 'word'], [2.6, 'word'], [SWIPE, 'swipe'], [SWIPE + 0.1, 'whoosh'],
  [DROP, 'impact'], [SWIPE + 0.45, 'word'], [DROP + 0.4, 'word'], ...TAPS.map(a => [a, 'click']), [TAPS[0] + 0.05, 'success'], [B(6), 'morph'],
  [TAPS[1] + 0.1, 'tick'], [B(7) + 1.6, 'collapse'], [B(8), 'count'], [B(9) + 0.4, 'logo']];

window.boot = async () => {
  $('crowd').innerHTML = ARR.map((a, i) => `<div class="item" id="n${i}"><div class="bar" style="width:${30 + (i * 37) % 40}%"></div><div class="bar" style="width:${60 + (i * 23) % 30}%;margin-top:18px"></div></div>`).join('');
  await fontsReady(["400 20px Inter", "600 20px Inter", "700 20px Inter", "800 20px Inter"]);
};

window.seek = async (t) => {
  T = t;
  css('world', { transform: `translate(${px((t * 14) % 48)},${px((t * 7) % 48)})` });
  // ACT 1: the crowd on the stage, under the camera
  if (show('stage', t < DROP + 0.5)) {
    const c = cam(t), gone = P(t, DROP, DROP + 0.45, E.inCubic);
    css('stage', { transform: `translate(${px(c.tx)},${px(c.ty)}) scale(${c.s.toFixed(5)})`, opacity: (1 - gone).toFixed(3), filter: `blur(${(gone * 12).toFixed(1)}px)` });
    ARR.forEach((a, i) => {
      if (!show('n' + i, t >= a)) return;
      let y = 0; for (let j = i + 1; j < ARR.length; j++) if (t >= ARR[j]) y += 136 * E.outCubic(clamp((t - ARR[j]) / 0.3));
      const ai = E.outExpo(clamp((t - a) / 0.35));
      let ty = 120 + y - (1 - ai) * 40, op = ai, bl = (1 - ai) * 6;
      if (i === ONE) { const g = P(t, SWIPE + 0.2, SWIPE + 0.9, E.inOutCubic); ty = lerp(ty, 480, g); bl = 0;           // the one glides to the centre
        css('n' + i, { height: px(lerp(120, 150, g)), marginTop: px(lerp(0, -15, g)) }); }
      else { const k = P(t, SWIPE + (ARR.length - i) * 0.012, SWIPE + 0.4 + (ARR.length - i) * 0.012, E.inCubic); ty -= 1100 * k; op *= 1 - k; bl += 10 * k; }
      if (ty > 1100) return show('n' + i, false);
      css('n' + i, { top: px(ty), opacity: op.toFixed(3), filter: bl > 0.1 ? `blur(${bl.toFixed(1)}px)` : '' });
    });
  }
  // ACT 2: the carrier takes over exactly on the drop and morphs through the states; slow push under every hold
  const d = Math.max(0, t - DROP);
  css('cw', { transform: `translate(${px(14 * Math.sin(d * 0.6))},${px(8 * Math.sin(d * 0.45))}) scale(${(1 + 0.012 * d).toFixed(5)})` });
  if (show('carrier', t >= DROP - 0.001 && t < B(8) + 0.35)) {
    const [w, h, cy, r] = kf(t, SHAPE), k = P(t, B(8), B(8) + 0.35, E.inCubic);
    css('carrier', { left: px(960 - w / 2), top: px(cy - h / 2), width: px(w), height: px(h), borderRadius: px(r),
      transform: `scale(${lerp(1, 0.1, k).toFixed(4)})`, opacity: (1 - k).toFixed(3) });
    layer('L1', DROP + 0.1, B(6) - 0.3); layer('L2', B(6) - 0.2, B(7) + 1.6); layer('L3', B(7) + 1.9, 99);
    $('act1').textContent = t >= TAPS[0] ? 'DONE ✓' : 'ACTION';
    $('fill').style.width = `${(P(t, TAPS[1], TAPS[1] + 0.8, E.inOutCubic) * 80).toFixed(1)}%`;     // the action's result, visible
  }
  // TAPS: the dot approaches, presses (scales down), a ripple expands
  let tp = null;
  for (const tt of TAPS) if (t > tt - 0.45 && t < tt + 0.4) {
    const [w, h, cy] = kf(tt, SHAPE); tp = { x: 960, y: cy + h / 2 - 52, a: P(t, tt - 0.45, tt - 0.3) * (1 - P(t, tt + 0.2, tt + 0.4)), t0: tt };
  }
  show('tap', !!tp); show('ripple', !!(tp && t >= tp.t0));
  if (tp) { css('tap', { left: px(tp.x), top: px(tp.y), opacity: tp.a.toFixed(3), transform: `scale(${(1 - 0.18 * Math.exp(-Math.max(0, t - tp.t0) * 12) * (t >= tp.t0)).toFixed(3)})` });
    if (t >= tp.t0) { const k = P(t, tp.t0, tp.t0 + 0.4), rr = 20 + 60 * k; css('ripple', { left: px(tp.x - rr), top: px(tp.y - rr), width: px(rr * 2), height: px(rr * 2), opacity: (1 - k).toFixed(3) }); } }
  // WORDS
  word('w0', 1.2, 2.5, 'cut'); word('w1', 2.6, SWIPE - 0.1, 'cut'); word('w2', SWIPE + 0.45, DROP - 0.3);
  word('w3', DROP + 0.4, B(6) - 0.2); word('w4', B(6) + 0.3, B(7) + 1.5);
  // SCALE: the carrier collapses into a number that proves it
  if (show('cwrap', t > B(8) + 0.3 && t < B(9) + 0.3)) { const a = P(t, B(8) + 0.3, B(8) + 0.65, E.outExpo), o = P(t, B(9), B(9) + 0.3);
    $('counter').textContent = Math.round(900 * P(t, B(8) + 0.3, B(8) + 1.5, E.outCubic))   /* same digit count at the end: no jump */ + '+';
    css('counter', { opacity: a * (1 - o), transform: `scale(${(1.2 - 0.2 * a + 0.04 * P(t, B(8) + 1.4, B(9))).toFixed(4)})` });
    css('clab', { opacity: P(t, B(8) + 0.3, B(8) + 0.6) * (1 - o) }); }
  // END CARD: the name, last
  const e = P(t, B(9) + 0.4, B(9) + 0.8, E.outExpo);
  if (show('end', e > 0)) css('end', { opacity: e, transform: `scale(${(1.08 - 0.08 * e + 0.03 * P(t, B(9) + 0.8, 22)).toFixed(4)})`, filter: `blur(${((1 - e) * 8).toFixed(1)}px)` });
};
</script>
</body>
</html>
